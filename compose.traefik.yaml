services:
  app:
    environment:
      AUTH_TRUST_HOST: "true"
    networks:
      - default
      - web
    labels:
      traefik.enable: "true"
      traefik.docker.network: "web"

      traefik.http.routers.event-yoga-app.rule: "Host(`app.event-yoga.com`)"
      traefik.http.routers.event-yoga-app.entrypoints: "websecure"
      traefik.http.routers.event-yoga-app.tls: "true"
      traefik.http.routers.event-yoga-app.tls.certresolver: "myresolver"
      traefik.http.routers.event-yoga-app.service: "event-yoga-app"

      traefik.http.services.event-yoga-app.loadbalancer.server.port: "3000"

      traefik.http.routers.event-yoga-app-http.rule: "Host(`app.event-yoga.com`)"
      traefik.http.routers.event-yoga-app-http.entrypoints: "web"
      traefik.http.routers.event-yoga-app-http.middlewares: "event-yoga-app-https"
      traefik.http.routers.event-yoga-app-http.service: "event-yoga-app"
      traefik.http.middlewares.event-yoga-app-https.redirectscheme.scheme: "https"

networks:
  default:
    name: event-management_default
  web:
    external: true
    name: web
